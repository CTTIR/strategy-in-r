name: Render and deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install bookdown and bs4_book deps
        run: |
          Rscript -e 'pkgs <- c("bookdown", "downlit", "bslib", "rmarkdown", "knitr", "xml2"); install.packages(setdiff(pkgs, rownames(installed.packages())))'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate actual examples and source references
        run: |
          node --test tests/*.test.cjs
          python3 scripts/check-source-refs.py
          python3 tests/test-epub.py
          Rscript tests/test-mcts.R

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF validation tools
        run: python -m pip install pypdf

      - name: Refresh source dates
        run: python3 scripts/update-page-provenance.py

      - name: Render HTML
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book")'

      - name: Validate rendered local links
        run: python3 scripts/check-html-links.py docs html-links.json

      - name: Render PDF
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::pdf_book")'

      - name: Render EPUB
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::epub_book")'

      - name: Validate EPUB when produced
        run: |
          if [ -f docs/strategy-in-r.epub ]; then
            python3 scripts/check-epub.py docs/strategy-in-r.epub epub-check.json
          fi

      - name: Extract verified chapter PDFs
        run: python3 scripts/split-chapter-pdfs.py

      - name: Disable Jekyll on Pages
        run: touch docs/.nojekyll

      - name: Verify page notes and downloadable formats
        run: |
          python3 tests/test_page_provenance.py
          python3 tests/test_book_delivery.py
          python3 tests/test_split_chapter_pdfs.py
          Rscript tests/test_setup_cache.R
          python3 scripts/finalize-book.py docs
          python3 scripts/check-book.py docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify every book and chapter download
        run: bash scripts/build-downloads-ci.sh docs strategy-in-r https://cttir.github.io/strategy-in-r/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
