name: Render HTML

on:
  pull_request:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Check source references
        run: python3 scripts/check-source-refs.py

      - name: Check MCTS teaching implementation
        run: Rscript tests/test-mcts.R

      - name: Render HTML
        run: quarto render --to html

      - name: Verify rendered links and assets
        run: python3 scripts/check-html-links.py _book html-links.json

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: _book/
