<!-- Dark/light mode toggle -->
<div class="sticky-item">
  <button type="button" id="mode-switch" class="btn-circle-mode" aria-label="Toggle dark mode">
    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
  </button>
</div>

<script>
  (function () {
    var stored = localStorage.getItem('themeMode');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var initial = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', initial);

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('mode-switch');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('themeMode', next);
      });
    });
  })();
</script>

<!-- Downloads are offered only when the optional output exists. -->
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    if (document.querySelector(".sidebar-downloads")) return;
    var anchor = null;
    var candidates = document.querySelectorAll(".sidebar-chapter a, aside a, nav a");
    for (var i = 0; i < candidates.length; i++) {
      var text = (candidates[i].textContent || "").trim().toLowerCase();
      if (text === "view source" || text === "edit this page") {
        if (!anchor) anchor = candidates[i].closest("h2, .page-links, div, ul");
      }
    }
    if (!anchor) return;
    // Chapter downloads come from the shared panel under each chapter title.
    var choices = [
      ["strategy-in-r.pdf", "Entire book (PDF)"],
      ["strategy-in-r.epub", "Entire book (EPUB)"]
    ];
    var available = await Promise.all(choices.map(async function (item) {
      try {
        var response = await fetch(item[0], { method: "HEAD" });
        return response.ok ? item : null;
      } catch (error) {
        return null;
      }
    }));
    available = available.filter(Boolean);
    if (!available.length) return;
    var heading = document.createElement("h2");
    heading.className = "sidebar-downloads-heading";
    heading.textContent = "Download";
    var list = document.createElement("ul");
    list.className = "sidebar-downloads";
    available.forEach(function (item) {
      var li = document.createElement("li");
      var link = document.createElement("a");
      link.href = item[0];
      link.textContent = item[1];
      li.appendChild(link);
      list.appendChild(li);
    });
    anchor.parentNode.insertBefore(heading, anchor);
    anchor.parentNode.insertBefore(list, anchor);
  });
</script>
